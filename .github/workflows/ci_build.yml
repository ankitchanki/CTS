name: CI Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    branches: [ '**' ]
    tags: [ v* ]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/**'
      - 'crowdin.yml'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write key
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Unit tests
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

          ./gradlew :app:testFullDebugUnitTest

      - name: Build Release (Full + Lite)
        run: |
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease ${RELEASE_TAG:+-PreleaseVersion=${RELEASE_TAG#v}}
          ls -l app/build/outputs/apk/*/release/*.apk

      - name: Set NAME_SUFFIX
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "NAME_SUFFIX=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "NAME_SUFFIX=${{ github.event.head_commit.id }}" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/*/release/*.apk
          name: Circlet_${{ env.NAME_SUFFIX }}

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Circlet ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/*/release/*.apk
          generate_release_notes: true

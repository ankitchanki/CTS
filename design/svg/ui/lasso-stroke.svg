<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Lasso being drawn in Circle to Search mode: blurred Pixel-gradient glow under a 5dp white core.
       SelectionOverlayView.strokeGlowPaint / strokePaint. -->
  <defs>
    <linearGradient id="pixel" x1="0" y1="0" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.25" stop-color="#EA4335"/>
      <stop offset="0.5" stop-color="#FBBC04"/><stop offset="0.75" stop-color="#34A853"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="360" height="360" fill="#5F6368"/>
  <path id="loop" d="M190,70C110,60 60,120 80,190C100,260 220,280 280,220C330,170 290,90 210,80C170,76 150,95 160,110"
        fill="none" stroke="url(#pixel)" stroke-width="14" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M190,70C110,60 60,120 80,190C100,260 220,280 280,220C330,170 290,90 210,80C170,76 150,95 160,110"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>

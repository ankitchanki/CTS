<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Committed selection: outside dimmed to 45% black, 20dp rounded box with gradient glow and white core. -->
  <defs>
    <linearGradient id="pixel" x1="0" y1="0" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/><stop offset="0.33" stop-color="#EA4335"/>
      <stop offset="0.66" stop-color="#FBBC04"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <mask id="outside"><rect width="360" height="360" fill="#fff"/><rect x="70" y="90" width="220" height="170" rx="20" fill="#000"/></mask>
  </defs>
  <rect width="360" height="360" fill="#BDC1C6"/>
  <rect width="360" height="360" fill="#000" fill-opacity="0.45" mask="url(#outside)"/>
  <rect x="70" y="90" width="220" height="170" rx="20" fill="none" stroke="url(#pixel)" stroke-width="14" filter="url(#blur)"/>
  <rect x="70" y="90" width="220" height="170" rx="20" fill="none" stroke="#FFFFFF" stroke-width="5"/>
</svg>

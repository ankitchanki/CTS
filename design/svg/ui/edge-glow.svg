<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <!-- Rotating edge glow (EdgeGlowRenderer): wide soft halo, mid glow and thin bright core sharing one
       sweep gradient around the screen centre; it spins every 3.6s and breathes ±12%.
       SVG has no conic gradient, so this frame uses a linear blend of the Pixel palette. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="360" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.33" stop-color="#EA4335"/>
      <stop offset="0.66" stop-color="#FBBC04"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="screen"><rect width="360" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect width="360" height="640" fill="#2D2F31"/>
    <rect width="360" height="640" rx="28" fill="none" stroke="url(#edge)" stroke-width="46" opacity="0.55" filter="url(#halo)"/>
    <rect width="360" height="640" rx="28" fill="none" stroke="url(#edge)" stroke-width="18" opacity="0.85" filter="url(#glow)"/>
    <rect width="360" height="640" rx="28" fill="none" stroke="url(#edge)" stroke-width="4"/>
  </g>
</svg>
